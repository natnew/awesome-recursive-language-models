name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Lint, link-check & readiness
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format check (Prettier)
        run: npm run build

      - name: Markdown lint
        run: npm run lint

      - name: Awesome-list lint
        run: npm run lint:awesome

      - name: Link check
        run: npm test

      # APM (Agent Package Manager) — install the CLI, resolve/lock agent assets,
      # and audit them. Flips the apm-ci-integration readiness criterion.
      - name: Install APM
        run: curl -sSL https://aka.ms/apm-unix | sh

      - name: APM install & audit
        run: |
          apm install
          apm audit --ci

      # Maintain step: fail the build if AI-readiness regresses below the target level.
      - name: AgentRC readiness gate
        run: npx -y github:microsoft/agentrc readiness --fail-level 3
